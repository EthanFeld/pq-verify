name: Extended vector regression

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ iverilog verilator

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      - name: Check all generated cases in Python
        run: python -m pytest model/

      - name: Check all generated cases in RTL
        run: make test-verify-ext
