name: RTL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog verilator

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      - name: Test Python reference
        run: python -m pytest model/

      - name: Lint RTL
        run: make lint

      - name: Test Keccak round and wrapper
        run: |
          make test-round
          make test-keccak-ooc

      - name: Test verifier and UART protocol
        run: |
          make test-verify-smoke
          make test-protocol

      - name: Test SHAKE and UART
        run: |
          make test-shake
          make test-uart
