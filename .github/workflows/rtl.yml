name: RTL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ iverilog verilator

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      - name: Cache Verilator models
        uses: actions/cache@v4
        with:
          path: build/**/verilator_model
          key: ubuntu-verilator-${{ hashFiles('rtl/**/*.sv', 'scripts/verilator_build.py') }}
          restore-keys: ubuntu-verilator-

      - name: Test Python reference
        env:
          PQ_VERIFY_GENERATED_LIMIT: 40
        run: python -m pytest model/

      - name: Test generated vector subset
        run: >-
          python scripts/run_verify_sim.py --vectors vectors/shake128s/generated.json --rpc 1 --jobs 4
          --tc 1000000 1000001 1000002 1000003 1000004 1000005 1000006 1000007 1000008 1000009
          1000010 1000011 1000012 1000013 1000014 1000015 1000016 1000017 1000018 1000019
          2000000 2000001 2000002 2000003 2000004 2000005 2000006 2000007 2000008 2000009
          2000010 2000011 2000012 2000013 2000014 2000015 2000016 2000017 2000018 2000019

      - name: Check benchmark evidence
        run: python scripts/check_evidence.py

      - name: Lint RTL
        run: make lint

      - name: Test Keccak round and wrapper
        run: |
          make test-round
          make test-keccak-ooc

      - name: Test verifier and UART protocol
        run: |
          make test-verify-smoke
          make test-verify
          make test-robust
          make test-protocol

      - name: Test SHAKE and UART
        run: |
          make test-shake
          make test-uart

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report formal tool versions
        run: |
          sby --version
          yosys --version
          boolector --version

      - name: Run formal targets
        run: make formal
