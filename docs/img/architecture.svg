<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">SLH-DSA verifier architecture</title>
  <desc id="desc">UART command path, verifier stages, synchronous memories, and shared SHAKE and Keccak datapath.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .sub { font-size: 13px; fill: #526176; }
      .box { rx: 14; stroke-width: 2; }
      .control { fill: #eaf1ff; stroke: #7c9de8; }
      .stage { fill: #eaf8f1; stroke: #6ab28b; }
      .hash { fill: #fff4df; stroke: #d7a340; }
      .memory { fill: #f4edff; stroke: #9b7bd0; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1120" height="650" fill="#fbfcfe"/>
  <text x="48" y="48" class="title">SLH-DSA-SHAKE-128s verifier</text>

  <rect x="55" y="94" width="190" height="76" class="box control"/>
  <text x="150" y="125" text-anchor="middle" class="label">UART host</text>
  <text x="150" y="148" text-anchor="middle" class="sub">frames + result</text>

  <rect x="310" y="94" width="205" height="76" class="box control"/>
  <text x="412" y="125" text-anchor="middle" class="label">cmd_ctrl</text>
  <text x="412" y="148" text-anchor="middle" class="sub">uart_rx / uart_tx</text>

  <rect x="580" y="94" width="250" height="76" class="box control"/>
  <text x="705" y="125" text-anchor="middle" class="label">slh_verify_top</text>
  <text x="705" y="148" text-anchor="middle" class="sub">request arbitration + result check</text>
  <path d="M245 132 H310" class="line"/>
  <path d="M515 132 H580" class="line"/>

  <rect x="80" y="232" width="205" height="84" class="box stage"/>
  <text x="182" y="266" text-anchor="middle" class="label">hmsg</text>
  <text x="182" y="290" text-anchor="middle" class="sub">message digest + indices</text>

  <rect x="345" y="232" width="205" height="84" class="box stage"/>
  <text x="447" y="266" text-anchor="middle" class="label">fors_verify</text>
  <text x="447" y="290" text-anchor="middle" class="sub">FORS roots</text>

  <rect x="610" y="232" width="230" height="84" class="box stage"/>
  <text x="725" y="266" text-anchor="middle" class="label">ht_verify</text>
  <text x="725" y="290" text-anchor="middle" class="sub">WOTS+ chains + XMSS paths</text>

  <path d="M285 274 H345" class="line"/>
  <path d="M550 274 H610" class="line"/>
  <path d="M705 170 V206 H182 V232" class="line"/>
  <path d="M705 170 V232" class="line"/>

  <rect x="915" y="226" width="155" height="75" class="box memory"/>
  <text x="992" y="256" text-anchor="middle" class="label">sig_ram</text>
  <text x="992" y="279" text-anchor="middle" class="sub">2,048 × 32-bit</text>
  <rect x="915" y="328" width="155" height="75" class="box memory"/>
  <text x="992" y="358" text-anchor="middle" class="label">scratch_ram</text>
  <text x="992" y="381" text-anchor="middle" class="sub">256 × 32-bit</text>
  <path d="M840 268 H915" class="line dashed"/>
  <path d="M840 290 C875 290 875 366 915 366" class="line dashed"/>

  <rect x="215" y="414" width="210" height="78" class="box hash"/>
  <text x="320" y="447" text-anchor="middle" class="label">thash</text>
  <text x="320" y="471" text-anchor="middle" class="sub">F / H / T_k / T_len</text>

  <rect x="500" y="414" width="210" height="78" class="box hash"/>
  <text x="605" y="447" text-anchor="middle" class="label">shake256</text>
  <text x="605" y="471" text-anchor="middle" class="sub">shared absorb / squeeze</text>

  <rect x="785" y="414" width="245" height="78" class="box hash"/>
  <text x="907" y="447" text-anchor="middle" class="label">keccak_f1600</text>
  <text x="907" y="471" text-anchor="middle" class="sub">iterative RPC round engine</text>

  <path d="M447 316 V366 H320 V414" class="line dashed"/>
  <path d="M725 316 V380 H425 V414" class="line dashed"/>
  <path d="M182 316 V388 H500 V444" class="line dashed"/>
  <path d="M425 453 H500" class="line"/>
  <path d="M710 453 H785" class="line"/>

  <rect x="500" y="542" width="530" height="64" class="box control"/>
  <text x="765" y="570" text-anchor="middle" class="label">keccak_round</text>
  <text x="765" y="591" text-anchor="middle" class="sub">generic or Gowin LUT4-mapped round</text>
  <path d="M907 492 V542" class="line"/>

  <text x="55" y="576" class="sub">Solid arrows: control or datapath flow</text>
  <text x="55" y="598" class="sub">Dashed arrows: shared service / memory access</text>
</svg>
